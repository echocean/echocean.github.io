<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3; url=https://echocean.org/">
  <link rel="canonical" href="https://echocean.org/">
  <title>正在前往 echocean.org</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f5f5f4;
      color: #292524;
    }

    main {
      width: min(34rem, calc(100% - 3rem));
      text-align: center;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    a {
      padding: 0.75rem 1rem;
      border: 1px solid #a8a29e;
      border-radius: 0.65rem;
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: #57534e;
      background: #e7e5e4;
    }

    .primary {
      border-color: #292524;
      background: #292524;
      color: #fafaf9;
    }

    .primary:hover,
    .primary:focus-visible {
      background: #44403c;
      color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1917;
        color: #e7e5e4;
      }

      a:hover,
      a:focus-visible {
        background: #292524;
      }

      .primary {
        border-color: #e7e5e4;
        background: #e7e5e4;
        color: #1c1917;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>页面正在跳转</h1>
    <p><span id="countdown">3</span> 秒后前往 echocean.org，你也可以先体验电子木鱼。</p>
    <div class="actions">
      <a class="primary" href="./fozu/">打开电子木鱼</a>
      <a href="https://echocean.org/">立即前往新网站</a>
    </div>
  </main>
  <script>
    const countdown = document.querySelector('#countdown')
    let seconds = 3

    const timer = setInterval(() => {
      seconds -= 1
      countdown.textContent = seconds

      if (seconds === 0) {
        clearInterval(timer)
        location.replace('https://echocean.org/')
      }
    }, 1000)
  </script>
</body>
</html>
